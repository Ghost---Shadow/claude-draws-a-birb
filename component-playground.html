<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Component Playground - Claude Draws a Birb</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a2a1a 0%, #2d4a1e 50%, #1a3010 100%);
      font-family: Georgia, serif;
      color: #e8dcc8;
    }

    header {
      padding: 1.5rem 2rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.7rem; text-shadow: 0 2px 6px rgba(0,0,0,0.4); }
    header a { font-size: 0.82rem; color: #90a878; text-decoration: none; }
    header a:hover { text-decoration: underline; }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: calc(100vh - 70px);
    }

    /* ---- Sidebar ---- */
    .sidebar {
      background: rgba(0,0,0,0.25);
      border-right: 1px solid rgba(255,255,255,0.07);
      padding: 1.2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .sidebar h2 {
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #a0b888;
      margin: 0.8rem 0 0.4rem;
    }
    .sidebar h2:first-child { margin-top: 0; }

    .comp-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #e0d4b8;
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 0.85rem;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .comp-btn:hover { background: rgba(255,255,255,0.12); }
    .comp-btn.active { background: rgba(120,180,80,0.22); border-color: rgba(120,180,80,0.45); }
    .comp-btn .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #5a9840; flex-shrink: 0;
      opacity: 0;
    }
    .comp-btn.active .dot { opacity: 1; }

    .sidebar-actions { display: flex; flex-direction: column; gap: 0.5rem; margin-top: auto; padding-top: 1rem; }
    .action-btn {
      background: rgba(80,150,50,0.25);
      border: 1px solid rgba(100,180,60,0.35);
      color: #c8e0a8;
      padding: 0.55rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 0.85rem;
      text-align: center;
      transition: background 0.15s;
    }
    .action-btn:hover { background: rgba(80,150,50,0.4); }
    .action-btn.danger {
      background: rgba(180,50,50,0.2);
      border-color: rgba(200,80,80,0.35);
      color: #e0a8a8;
    }
    .action-btn.danger:hover { background: rgba(180,50,50,0.35); }

    /* ---- Main panel ---- */
    .main {
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
    }

    .canvas-area {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: rgba(0,0,0,0.15);
      overflow: auto;
    }

    #composeSvg {
      background: #f5f0e8;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      max-width: 100%;
      height: auto;
    }

    /* ---- Controls panel ---- */
    .controls-panel {
      background: rgba(0,0,0,0.3);
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 1.2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .controls-panel h3 {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #90a868;
      margin-bottom: 0.2rem;
    }

    .param-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.6rem 1.2rem;
    }

    .param-row {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .param-row label {
      font-size: 0.75rem;
      color: #a8b890;
      display: flex;
      justify-content: space-between;
    }
    .param-row label span { color: #d8c8a0; font-weight: bold; }
    .param-row input[type="range"] {
      width: 100%;
      accent-color: #6aba40;
    }
    .param-row input[type="color"] {
      width: 100%;
      height: 28px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
    }
    .param-row select {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.15);
      color: #e0d4b8;
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      font-family: Georgia, serif;
      font-size: 0.8rem;
    }
    .param-row input[type="checkbox"] {
      accent-color: #6aba40;
      width: 16px; height: 16px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: #a8b890;
    }

    /* ---- Component showcase ---- */
    #showcase {
      display: none;
    }
    #showcase.visible {
      display: block;
    }

    /* ---- Tab bar ---- */
    .tabs {
      display: flex;
      gap: 0.3rem;
      padding: 0.8rem 1.5rem 0;
      background: rgba(0,0,0,0.3);
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .tab-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-bottom: none;
      color: #a0b080;
      padding: 0.4rem 1rem;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 0.82rem;
      transition: background 0.15s;
    }
    .tab-btn.active { background: rgba(0,0,0,0.3); color: #e0d4b8; border-color: rgba(255,255,255,0.15); }
    .tab-btn:hover:not(.active) { background: rgba(255,255,255,0.1); }

    /* ---- Showcase grid ---- */
    .showcase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.2rem;
      padding: 1.5rem;
      background: rgba(0,0,0,0.2);
      max-height: 320px;
      overflow-y: auto;
    }
    .showcase-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 0.8rem;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .showcase-card:hover { background: rgba(255,255,255,0.1); }
    .showcase-card svg { display: block; margin: 0 auto 0.5rem; }
    .showcase-card p { font-size: 0.75rem; color: #90a868; }
  </style>
</head>
<body>

<header>
  <h1>SVG Component Playground</h1>
  <a href="index.html">&larr; Gallery</a>
</header>

<div class="layout">
  <!-- SIDEBAR: component list + actions -->
  <aside class="sidebar">
    <h2>Add Component</h2>

    <button class="comp-btn" data-comp="eye" onclick="addComponent('eye')">
      <span class="dot"></span> Eye
    </button>
    <button class="comp-btn" data-comp="beak" onclick="addComponent('beak')">
      <span class="dot"></span> Beak
    </button>
    <button class="comp-btn" data-comp="head" onclick="addComponent('head')">
      <span class="dot"></span> Head
    </button>
    <button class="comp-btn" data-comp="body" onclick="addComponent('body')">
      <span class="dot"></span> Body
    </button>
    <button class="comp-btn" data-comp="wing" onclick="addComponent('wing')">
      <span class="dot"></span> Wing
    </button>
    <button class="comp-btn" data-comp="tail" onclick="addComponent('tail')">
      <span class="dot"></span> Tail
    </button>
    <button class="comp-btn" data-comp="legs" onclick="addComponent('legs')">
      <span class="dot"></span> Legs
    </button>
    <button class="comp-btn" data-comp="branch" onclick="addComponent('branch')">
      <span class="dot"></span> Branch
    </button>
    <button class="comp-btn" data-comp="shadow" onclick="addComponent('shadow')">
      <span class="dot"></span> Shadow
    </button>
    <button class="comp-btn" data-comp="vignette" onclick="addComponent('vignette')">
      <span class="dot"></span> Vignette
    </button>
    <button class="comp-btn" data-comp="bokeh" onclick="addComponent('bokeh')">
      <span class="dot"></span> Bokeh BG
    </button>
    <button class="comp-btn" data-comp="featherTexture" onclick="addComponent('featherTexture')">
      <span class="dot"></span> Feather Texture
    </button>

    <h2>Presets</h2>
    <button class="comp-btn" onclick="loadPreset('flatBird')"><span class="dot"></span> Flat Bird</button>
    <button class="comp-btn" onclick="loadPreset('robinStyle')"><span class="dot"></span> Robin Style</button>
    <button class="comp-btn" onclick="loadPreset('hummingbird')"><span class="dot"></span> Hummingbird</button>

    <h2>Layer Order</h2>
    <div id="layerList" style="font-size:0.78rem; color:#a0a888; min-height:30px; padding:0.3rem 0;"></div>
    <div style="display:flex;gap:0.4rem;flex-wrap:wrap;">
      <button class="comp-btn" style="font-size:0.75rem;padding:0.3rem 0.6rem;" onclick="moveSelected(-1)">Move Up</button>
      <button class="comp-btn" style="font-size:0.75rem;padding:0.3rem 0.6rem;" onclick="moveSelected(1)">Move Down</button>
      <button class="comp-btn" style="font-size:0.75rem;padding:0.3rem 0.6rem;" onclick="removeSelected()">Remove</button>
    </div>

    <div class="sidebar-actions">
      <button class="action-btn" onclick="exportSVG()">Export SVG</button>
      <button class="action-btn danger" onclick="clearAll()">Clear All</button>
    </div>
  </aside>

  <!-- MAIN: canvas + tabs -->
  <div class="main">
    <div class="canvas-area">
      <svg id="composeSvg" width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <!-- components rendered here -->
      </svg>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('params')">Parameters</button>
      <button class="tab-btn" onclick="showTab('showcase')">Component Showcase</button>
    </div>

    <!-- Parameters panel -->
    <div id="paramsPanel" class="controls-panel">
      <h3 id="paramsTitle">Select a component or add one from the sidebar</h3>
      <div class="param-grid" id="paramGrid"></div>
    </div>

    <!-- Showcase panel -->
    <div id="showcasePanel" style="display:none;">
      <div class="showcase-grid" id="showcaseGrid"></div>
    </div>
  </div>
</div>

<script src="svg-components.js"></script>
<script>
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const W = 500, H = 500;

// Each layer: { id, type, params }
let layers = [];
let selectedId = null;
let nextId = 1;

// Default params per component type
const DEFAULTS = {
  eye: { cx: 250, cy: 200, r: 12, pupilRatio: 0.55, highlightAngle: 315,
         irisColor: '#0C0604', ringColor: '#5A4D3E', ringOpacity: 0.2 },
  beak: { x: 300, y: 220, length: 30, angle: 0, thickness: 8, color: '#1A1410', style: 'conical' },
  head: { cx: 250, cy: 180, r: 55, color: '#1D2B3A', gradient: false, gradientEnd: '#0d1520', style: 'circle' },
  body: { cx: 250, cy: 295, rx: 130, ry: 90, color: '#F09060', gradient: true, gradientEnd: '#D86838', style: 'ellipse', rotationDeg: 0 },
  wing: { cx: 200, cy: 270, width: 120, height: 140, color: '#1D2B3A', style: 'flat', rotationDeg: 0, featherLines: true },
  tail: { x: 120, y: 300, width: 60, length: 80, color: '#E06040', angle: 200, split: false },
  legs: { x: 250, y: 370, legLength: 45, spread: 22, toeCount: 3, toeLength: 18, color: '#9B7B5A', strokeWidth: 3, style: 'perched' },
  branch: { x1: 40, y1: 400, x2: 460, y2: 395, thickness: 16, color: '#7A5028', highlightColor: '#B08040', bark: true, gradient: true },
  shadow: { cx: 250, cy: 445, rx: 80, ry: 7, color: '#c0c5cc', opacity: 0.5 },
  vignette: { width: 500, height: 500, opacity: 0.55, color: '#000000' },
  bokeh: { width: 500, height: 500, colors: ['#2d5016', '#4a7c23', '#3d6b1c'], count: 10, minR: 30, maxR: 100, seed: 42 },
  featherTexture: { cx: 250, cy: 250, rx: 60, ry: 95, color: '#189870', opacity: 0.75, baseFreqX: 0.038, baseFreqY: 0.028, seed: 11, alphaScale: 8, alphaBias: -3.2 },
};

// Human-readable param specs: [key, type, min, max, step, label]
const PARAM_SPECS = {
  eye: [
    ['cx','range',0,500,1,'Centre X'],
    ['cy','range',0,500,1,'Centre Y'],
    ['r','range',4,40,0.5,'Radius'],
    ['pupilRatio','range',0.2,0.9,0.01,'Pupil Ratio'],
    ['highlightAngle','range',0,360,1,'Highlight Angle'],
    ['irisColor','color',null,null,null,'Iris Color'],
    ['ringColor','color',null,null,null,'Ring Color'],
    ['ringOpacity','range',0,1,0.01,'Ring Opacity'],
  ],
  beak: [
    ['x','range',0,500,1,'Base X'],
    ['y','range',0,500,1,'Base Y'],
    ['length','range',10,80,1,'Length'],
    ['angle','range',-180,180,1,'Angle (°)'],
    ['thickness','range',2,20,0.5,'Thickness'],
    ['color','color',null,null,null,'Color'],
    ['style','select',['conical','hooked','thin'],'Style'],
  ],
  head: [
    ['cx','range',0,500,1,'Centre X'],
    ['cy','range',0,500,1,'Centre Y'],
    ['r','range',10,120,1,'Radius'],
    ['color','color',null,null,null,'Color'],
    ['gradient','checkbox',null,null,null,'Gradient'],
    ['gradientEnd','color',null,null,null,'Gradient End'],
    ['style','select',['circle','bezier'],'Style'],
  ],
  body: [
    ['cx','range',0,500,1,'Centre X'],
    ['cy','range',0,500,1,'Centre Y'],
    ['rx','range',10,250,1,'Radius X'],
    ['ry','range',10,200,1,'Radius Y'],
    ['color','color',null,null,null,'Color'],
    ['gradient','checkbox',null,null,null,'Gradient'],
    ['gradientEnd','color',null,null,null,'Gradient End'],
    ['style','select',['ellipse','bezier'],'Style'],
    ['rotationDeg','range',-90,90,1,'Rotation (°)'],
  ],
  wing: [
    ['cx','range',0,500,1,'Centre X'],
    ['cy','range',0,500,1,'Centre Y'],
    ['width','range',20,300,1,'Width'],
    ['height','range',20,300,1,'Height'],
    ['color','color',null,null,null,'Color'],
    ['style','select',['flat','feathered'],'Style'],
    ['rotationDeg','range',-90,90,1,'Rotation (°)'],
    ['featherLines','checkbox',null,null,null,'Feather Lines'],
  ],
  tail: [
    ['x','range',0,500,1,'Base X'],
    ['y','range',0,500,1,'Base Y'],
    ['width','range',10,150,1,'Width'],
    ['length','range',10,150,1,'Length'],
    ['color','color',null,null,null,'Color'],
    ['angle','range',0,360,1,'Angle (°)'],
    ['split','checkbox',null,null,null,'Fan/Split'],
  ],
  legs: [
    ['x','range',0,500,1,'Centre X'],
    ['y','range',0,500,1,'Top Y'],
    ['legLength','range',10,100,1,'Leg Length'],
    ['spread','range',0,80,1,'Spread'],
    ['toeCount','range',2,4,1,'Toe Count'],
    ['toeLength','range',5,40,1,'Toe Length'],
    ['color','color',null,null,null,'Color'],
    ['strokeWidth','range',1,8,0.5,'Stroke Width'],
    ['style','select',['perched','rect'],'Style'],
  ],
  branch: [
    ['x1','range',0,500,1,'Start X'],
    ['y1','range',0,500,1,'Start Y'],
    ['x2','range',0,500,1,'End X'],
    ['y2','range',0,500,1,'End Y'],
    ['thickness','range',4,40,1,'Thickness'],
    ['color','color',null,null,null,'Color'],
    ['highlightColor','color',null,null,null,'Highlight Color'],
    ['bark','checkbox',null,null,null,'Bark Knots'],
    ['gradient','checkbox',null,null,null,'Gradient'],
  ],
  shadow: [
    ['cx','range',0,500,1,'Centre X'],
    ['cy','range',0,500,1,'Centre Y'],
    ['rx','range',10,200,1,'Radius X'],
    ['ry','range',1,30,0.5,'Radius Y'],
    ['color','color',null,null,null,'Color'],
    ['opacity','range',0,1,0.01,'Opacity'],
  ],
  vignette: [
    ['opacity','range',0,1,0.01,'Opacity'],
    ['color','color',null,null,null,'Color'],
  ],
  bokeh: [
    ['count','range',1,25,1,'Circle Count'],
    ['minR','range',5,100,1,'Min Radius'],
    ['maxR','range',20,200,1,'Max Radius'],
    ['seed','range',1,200,1,'Seed'],
  ],
  featherTexture: [
    ['cx','range',0,500,1,'Centre X'],
    ['cy','range',0,500,1,'Centre Y'],
    ['rx','range',10,200,1,'Radius X'],
    ['ry','range',10,250,1,'Radius Y'],
    ['color','color',null,null,null,'Texture Color'],
    ['opacity','range',0,1,0.01,'Opacity'],
    ['baseFreqX','range',0.005,0.15,0.001,'Base Freq X'],
    ['baseFreqY','range',0.005,0.15,0.001,'Base Freq Y'],
    ['seed','range',1,100,1,'Seed'],
    ['alphaScale','range',1,20,0.1,'Alpha Scale'],
    ['alphaBias','range',-10,0,0.05,'Alpha Bias'],
  ],
};

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function renderComponent(type, params) {
  return svgComponents[type](params);
}

function renderAll() {
  const svg = document.getElementById('composeSvg');
  svg.innerHTML = layers.map(l => {
    try { return renderComponent(l.type, l.params); }
    catch(e) { return `<!-- error: ${e.message} -->`; }
  }).join('\n');
}

// ---------------------------------------------------------------------------
// Layer management
// ---------------------------------------------------------------------------
function addComponent(type) {
  const id = nextId++;
  const params = JSON.parse(JSON.stringify(DEFAULTS[type] || {}));
  layers.push({ id, type, params });
  selectLayer(id);
  renderAll();
  updateLayerList();
}

function selectLayer(id) {
  selectedId = id;
  const layer = layers.find(l => l.id === id);
  buildParamUI(layer);
  updateLayerList();
}

function moveSelected(dir) {
  if (selectedId == null) return;
  const idx = layers.findIndex(l => l.id === selectedId);
  if (idx < 0) return;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= layers.length) return;
  [layers[idx], layers[newIdx]] = [layers[newIdx], layers[idx]];
  renderAll();
  updateLayerList();
}

function removeSelected() {
  if (selectedId == null) return;
  layers = layers.filter(l => l.id !== selectedId);
  selectedId = null;
  document.getElementById('paramsTitle').textContent = 'Select a component';
  document.getElementById('paramGrid').innerHTML = '';
  renderAll();
  updateLayerList();
}

function clearAll() {
  layers = [];
  selectedId = null;
  document.getElementById('paramsTitle').textContent = 'Add a component from the sidebar';
  document.getElementById('paramGrid').innerHTML = '';
  renderAll();
  updateLayerList();
}

function updateLayerList() {
  const el = document.getElementById('layerList');
  if (layers.length === 0) {
    el.textContent = 'No layers yet.';
    return;
  }
  el.innerHTML = [...layers].reverse().map(l => {
    const sel = l.id === selectedId;
    return `<div style="padding:0.25rem 0.4rem;border-radius:4px;cursor:pointer;
                        background:${sel ? 'rgba(100,180,60,0.2)' : 'transparent'};
                        border: 1px solid ${sel ? 'rgba(100,180,60,0.4)' : 'transparent'};
                        margin-bottom:2px; font-size:0.76rem;"
                 onclick="selectLayer(${l.id})">${l.id}. ${l.type}</div>`;
  }).join('');
}

// ---------------------------------------------------------------------------
// Parameter UI
// ---------------------------------------------------------------------------
function buildParamUI(layer) {
  if (!layer) return;
  document.getElementById('paramsTitle').textContent = `Editing: ${layer.type} (#${layer.id})`;
  const grid = document.getElementById('paramGrid');
  const specs = PARAM_SPECS[layer.type] || [];
  grid.innerHTML = '';

  specs.forEach(spec => {
    const [key, type, ...rest] = spec;
    const row = document.createElement('div');
    row.className = 'param-row';
    const current = layer.params[key];

    if (type === 'range') {
      const [min, max, step, label] = rest;
      const val = typeof current === 'number' ? current : min;
      row.innerHTML = `
        <label>${label} <span id="val_${layer.id}_${key}">${val}</span></label>
        <input type="range" min="${min}" max="${max}" step="${step}" value="${val}"
               oninput="updateParam(${layer.id},'${key}',parseFloat(this.value));document.getElementById('val_${layer.id}_${key}').textContent=this.value"/>
      `;
    } else if (type === 'color') {
      const [,,,label] = rest;
      const val = current || '#888888';
      row.innerHTML = `
        <label>${label}</label>
        <input type="color" value="${val.length === 7 ? val : '#888888'}"
               oninput="updateParam(${layer.id},'${key}',this.value)"/>
      `;
    } else if (type === 'select') {
      const [options, label] = rest;
      const optHtml = options.map(o => `<option value="${o}" ${o === current ? 'selected' : ''}>${o}</option>`).join('');
      row.innerHTML = `
        <label>${label}</label>
        <select onchange="updateParam(${layer.id},'${key}',this.value)">${optHtml}</select>
      `;
    } else if (type === 'checkbox') {
      const [,,,label] = rest;
      row.innerHTML = `
        <div class="checkbox-row">
          <input type="checkbox" ${current ? 'checked' : ''}
                 onchange="updateParam(${layer.id},'${key}',this.checked)"/>
          <label>${label}</label>
        </div>
      `;
    }

    grid.appendChild(row);
  });
}

function updateParam(layerId, key, value) {
  const layer = layers.find(l => l.id === layerId);
  if (!layer) return;
  layer.params[key] = value;
  renderAll();
}

// ---------------------------------------------------------------------------
// Export SVG
// ---------------------------------------------------------------------------
function exportSVG() {
  const svg = document.getElementById('composeSvg');
  const serializer = new XMLSerializer();
  let svgStr = serializer.serializeToString(svg);
  // Ensure proper namespace
  if (!svgStr.includes('xmlns="http://www.w3.org/2000/svg"')) {
    svgStr = svgStr.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  }
  const blob = new Blob([svgStr], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'bird-composition.svg';
  a.click();
  URL.revokeObjectURL(url);
}

// ---------------------------------------------------------------------------
// Tab switching
// ---------------------------------------------------------------------------
function showTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('paramsPanel').style.display = tab === 'params' ? '' : 'none';
  document.getElementById('showcasePanel').style.display = tab === 'showcase' ? '' : 'none';
  if (tab === 'showcase') buildShowcase();
}

// ---------------------------------------------------------------------------
// Component Showcase
// ---------------------------------------------------------------------------
function buildShowcase() {
  const grid = document.getElementById('showcaseGrid');
  if (grid.dataset.built) return;
  grid.dataset.built = '1';

  const showcaseConfigs = [
    { type: 'eye',    params: { cx: 60, cy: 60, r: 20, highlightAngle: 315 }, w: 120, h: 120 },
    { type: 'beak',   params: { x: 30, y: 60, length: 50, angle: 0, thickness: 12, style: 'conical' }, w: 120, h: 120 },
    { type: 'head',   params: { cx: 60, cy: 65, r: 50, color: '#1D2B3A' }, w: 120, h: 130 },
    { type: 'body',   params: { cx: 90, cy: 75, rx: 75, ry: 50, color: '#F09060', gradient: true, gradientEnd: '#D86838' }, w: 180, h: 150 },
    { type: 'wing',   params: { cx: 90, cy: 75, width: 110, height: 100, color: '#1D2B3A', featherLines: true }, w: 180, h: 150 },
    { type: 'tail',   params: { x: 80, y: 30, width: 50, length: 70, color: '#E06040', angle: 120 }, w: 160, h: 140 },
    { type: 'legs',   params: { x: 90, y: 20, legLength: 55, spread: 20, toeCount: 3, toeLength: 18, color: '#9B7B5A', strokeWidth: 3 }, w: 180, h: 120 },
    { type: 'branch', params: { x1: 10, y1: 55, x2: 170, y2: 50, thickness: 14, color: '#7A5028' }, w: 180, h: 110 },
    { type: 'shadow', params: { cx: 90, cy: 55, rx: 70, ry: 8, color: '#c0c5cc', opacity: 0.6 }, w: 180, h: 110 },
    { type: 'vignette', params: { width: 160, height: 100, opacity: 0.6 }, w: 160, h: 100 },
    { type: 'bokeh',  params: { width: 160, height: 100, count: 7, minR: 15, maxR: 45, seed: 9 }, w: 160, h: 100 },
    { type: 'featherTexture', params: { cx: 80, cy: 65, rx: 55, ry: 55, color: '#189870', opacity: 0.8, seed: 11 }, w: 160, h: 130 },
  ];

  showcaseConfigs.forEach(cfg => {
    const card = document.createElement('div');
    card.className = 'showcase-card';
    card.title = `Click to add ${cfg.type}`;

    // Build mini SVG preview
    const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svgEl.setAttribute('width', cfg.w);
    svgEl.setAttribute('height', cfg.h);
    svgEl.setAttribute('viewBox', `0 0 ${cfg.w} ${cfg.h}`);
    svgEl.style.background = cfg.type === 'vignette' ? '#556644' :
                              cfg.type === 'bokeh'    ? '#2a4a1a' : '#f0ead8';
    svgEl.style.borderRadius = '6px';

    try {
      svgEl.innerHTML = svgComponents[cfg.type](cfg.params);
    } catch(e) {
      svgEl.innerHTML = `<text x="5" y="20" fill="red" font-size="10">Error</text>`;
    }

    card.appendChild(svgEl);
    const p = document.createElement('p');
    p.textContent = cfg.type;
    card.appendChild(p);
    card.onclick = () => addComponent(cfg.type);
    grid.appendChild(card);
  });
}

function loadPreset(name) {
  clearAll();
  const preset = PRESETS[name];
  if (!preset) return;
  preset.forEach(({ type, params }) => {
    const id = nextId++;
    layers.push({ id, type, params: JSON.parse(JSON.stringify(params)) });
  });
  renderAll();
  updateLayerList();
  if (layers.length > 0) selectLayer(layers[layers.length - 1].id);
}
