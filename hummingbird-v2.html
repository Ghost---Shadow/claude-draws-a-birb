<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hummingbird v2 - Claude Draws a Birb</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a3028 0%, #2a4a38 50%, #0a2018 100%);
      font-family: Georgia, serif;
    }
    h1 { color: #e8dcc8; margin-bottom: 1rem; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .container { background: rgba(0,0,0,0.15); border-radius: 16px; padding: 2rem; }
    a.back { color: #c8b890; text-decoration: none; font-size: 0.9rem; margin-bottom: 1rem; display: block; }
    a.back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <a class="back" href="index.html">&larr; Back to gallery</a>
  <h1>Hummingbird v2</h1>
  <div class="container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 420" width="550" height="420">
      <defs>
        <radialGradient id="bg" cx="55%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#2a5848"/>
          <stop offset="40%" stop-color="#1a3830"/>
          <stop offset="100%" stop-color="#0a1810"/>
        </radialGradient>
        <radialGradient id="leafBlur" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#48b0a0" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#48b0a0" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="darkBody" x1="0" y1="0" x2="0.3" y2="1">
          <stop offset="0%" stop-color="#1a2520"/>
          <stop offset="100%" stop-color="#0e1512"/>
        </linearGradient>

        <linearGradient id="branchG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8a7058"/>
          <stop offset="100%" stop-color="#6a5040"/>
        </linearGradient>

        <!-- Shadow -->
        <filter id="shadow" x="-12%" y="-5%" width="125%" height="115%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
          <feOffset dy="3"/>
          <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
          <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>

        <!-- Iridescent spot blur -->
        <filter id="spotBlur">
          <feGaussianBlur stdDeviation="1.5"/>
        </filter>

        <!-- Clip for back iridescence -->
        <clipPath id="backClip">
          <path d="M 260,140 C 240,145 215,165 205,195 C 195,230 195,270 205,300 C 215,325 240,340 270,340 C 305,340 330,320 340,290 C 350,255 345,215 330,180 C 318,158 290,140 260,140 Z"/>
        </clipPath>

        <!-- Clip for head -->
        <clipPath id="headClip">
          <path d="M 330,130 C 360,132 388,155 392,185 C 395,210 382,235 362,245 C 345,252 325,248 312,235 C 298,220 290,198 292,178 C 295,152 312,135 330,130 Z"/>
        </clipPath>

        <!-- Clip for throat -->
        <clipPath id="throatClip">
          <path d="M 340,190 C 355,195 372,210 378,228 C 382,242 375,255 362,258 C 348,260 335,252 330,240 C 325,228 328,210 335,198 Z"/>
        </clipPath>

        <radialGradient id="vignette" cx="55%" cy="42%" r="55%">
          <stop offset="0%" stop-color="transparent"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
        </radialGradient>
      </defs>

      <!-- Background -->
      <rect width="550" height="420" fill="url(#bg)"/>
      <ellipse cx="480" cy="80" rx="80" ry="35" fill="url(#leafBlur)" transform="rotate(-25,480,80)"/>
      <ellipse cx="500" cy="150" rx="70" ry="30" fill="url(#leafBlur)" transform="rotate(-15,500,150)"/>
      <ellipse cx="60" cy="120" rx="60" ry="25" fill="url(#leafBlur)" transform="rotate(20,60,120)"/>
      <ellipse cx="100" cy="350" rx="50" ry="20" fill="url(#leafBlur)" transform="rotate(10,100,350)"/>

      <!-- Branch -->
      <path d="M 30,320 C 150,305 320,295 520,310" stroke="url(#branchG)" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M 30,317 C 150,302 320,292 520,307" stroke="#9a8068" stroke-width="2.5" fill="none" opacity="0.35"/>
      <path d="M 400,300 C 420,280 445,268 460,262" stroke="#7a6048" stroke-width="5" fill="none" stroke-linecap="round"/>

      <!-- ===== HUMMINGBIRD ===== -->
      <g filter="url(#shadow)">

        <!-- Tail feathers (dark, fanning down-left) -->
        <path d="M 200,295 C 170,312 120,340 90,358 C 85,362 88,365 95,362 C 130,345 175,320 200,305 Z" fill="#0e1512"/>
        <path d="M 195,302 C 162,320 108,352 78,370 C 72,374 75,378 82,375 C 115,358 165,330 198,312 Z" fill="#121a18"/>
        <path d="M 192,310 C 158,328 100,362 68,382 C 62,386 65,390 72,387 C 108,370 160,338 195,318 Z" fill="#0e1512"/>
        <!-- White tail tip -->
        <ellipse cx="72" cy="386" rx="4" ry="2.5" fill="white" opacity="0.45"/>

        <!-- Main body — sleek, elongated, dark -->
        <path d="M 300,148
                 C 340,150 370,175 378,215
                 C 384,248 375,285 355,310
                 C 338,330 310,340 280,338
                 C 248,335 220,318 208,295
                 C 195,270 192,240 198,210
                 C 205,178 230,155 265,148
                 C 278,146 290,146 300,148 Z"
              fill="url(#darkBody)"/>

        <!-- Iridescent teal patches on back — many small spots -->
        <g clip-path="url(#backClip)">
          <!-- Row 1: upper back -->
          <circle cx="252" cy="172" r="5" fill="#20c8a0" opacity="0.6" filter="url(#spotBlur)"/>
          <circle cx="265" cy="168" r="4.5" fill="#18b890" opacity="0.55"/>
          <circle cx="278" cy="172" r="5" fill="#22c8a0" opacity="0.5" filter="url(#spotBlur)"/>
          <circle cx="290" cy="170" r="4" fill="#15b898" opacity="0.45"/>
          <circle cx="245" cy="180" r="4" fill="#28d8b0" opacity="0.5"/>
          <circle cx="258" cy="182" r="5.5" fill="#20c8a0" opacity="0.55" filter="url(#spotBlur)"/>
          <circle cx="272" cy="180" r="4.5" fill="#18b898" opacity="0.5"/>
          <circle cx="286" cy="182" r="4" fill="#22c8a0" opacity="0.45"/>
          <!-- Row 2: mid-upper -->
          <circle cx="238" cy="195" r="5" fill="#20c8a0" opacity="0.55" filter="url(#spotBlur)"/>
          <circle cx="252" cy="192" r="4.5" fill="#25d0a8" opacity="0.55"/>
          <circle cx="266" cy="195" r="5.5" fill="#18c898" opacity="0.6" filter="url(#spotBlur)"/>
          <circle cx="280" cy="192" r="4" fill="#22c8a0" opacity="0.5"/>
          <circle cx="294" cy="195" r="4.5" fill="#15b898" opacity="0.45" filter="url(#spotBlur)"/>
          <circle cx="245" cy="205" r="4" fill="#28d8b0" opacity="0.5"/>
          <circle cx="258" cy="208" r="5" fill="#20c8a0" opacity="0.55" filter="url(#spotBlur)"/>
          <circle cx="272" cy="205" r="4.5" fill="#18b890" opacity="0.5"/>
          <circle cx="286" cy="208" r="4" fill="#22c8a0" opacity="0.45"/>
          <!-- Row 3: mid -->
          <circle cx="232" cy="220" r="5" fill="#20c8a0" opacity="0.5" filter="url(#spotBlur)"/>
          <circle cx="246" cy="218" r="4.5" fill="#22c8a0" opacity="0.55"/>
          <circle cx="260" cy="222" r="5.5" fill="#18c898" opacity="0.55" filter="url(#spotBlur)"/>
          <circle cx="274" cy="218" r="4" fill="#25d0a8" opacity="0.5"/>
          <circle cx="288" cy="222" r="5" fill="#15b898" opacity="0.45" filter="url(#spotBlur)"/>
          <circle cx="238" cy="232" r="4" fill="#28d8b0" opacity="0.45"/>
          <circle cx="252" cy="235" r="5" fill="#20c8a0" opacity="0.5" filter="url(#spotBlur)"/>
          <circle cx="266" cy="232" r="4.5" fill="#18b890" opacity="0.45"/>
          <circle cx="280" cy="235" r="4" fill="#22c8a0" opacity="0.4"/>
          <!-- Row 4: lower-mid -->
          <circle cx="235" cy="248" r="5" fill="#20c8a0" opacity="0.45" filter="url(#spotBlur)"/>
          <circle cx="250" cy="250" r="4.5" fill="#18c898" opacity="0.5"/>
          <circle cx="265" cy="248" r="5" fill="#22c8a0" opacity="0.45" filter="url(#spotBlur)"/>
          <circle cx="280" cy="252" r="4" fill="#15b898" opacity="0.4"/>
          <circle cx="242" cy="262" r="4.5" fill="#20c8a0" opacity="0.4"/>
          <circle cx="258" cy="265" r="5" fill="#18b890" opacity="0.45" filter="url(#spotBlur)"/>
          <circle cx="272" cy="262" r="4" fill="#25d0a8" opacity="0.4"/>
          <!-- Row 5: lower -->
          <circle cx="240" cy="278" r="4.5" fill="#20c8a0" opacity="0.35" filter="url(#spotBlur)"/>
          <circle cx="255" cy="280" r="4" fill="#18c898" opacity="0.4"/>
          <circle cx="270" cy="278" r="5" fill="#15a888" opacity="0.35" filter="url(#spotBlur)"/>
          <circle cx="248" cy="295" r="4" fill="#20b890" opacity="0.3"/>
          <circle cx="262" cy="298" r="4.5" fill="#18b898" opacity="0.3" filter="url(#spotBlur)"/>
        </g>

        <!-- Wing (dark, folded along body) -->
        <path d="M 250,178
                 C 268,172 285,180 295,198
                 C 310,225 315,265 308,300
                 C 305,318 295,332 278,336
                 C 260,340 245,332 238,318
                 C 228,295 224,262 228,232
                 C 232,208 240,190 250,178 Z"
              fill="#0a1210" opacity="0.85"/>

        <!-- Head -->
        <path d="M 330,130
                 C 360,132 388,155 392,185
                 C 395,210 382,235 362,245
                 C 345,252 325,248 312,235
                 C 298,220 290,198 292,178
                 C 295,152 312,135 330,130 Z"
              fill="url(#darkBody)"/>

        <!-- Iridescent head patches — smaller, denser -->
        <g clip-path="url(#headClip)">
          <circle cx="325" cy="148" r="4.5" fill="#20c8a0" opacity="0.55" filter="url(#spotBlur)"/>
          <circle cx="338" cy="145" r="4" fill="#18b890" opacity="0.5"/>
          <circle cx="350" cy="148" r="5" fill="#22c8a0" opacity="0.5" filter="url(#spotBlur)"/>
          <circle cx="362" cy="152" r="4" fill="#15b898" opacity="0.45"/>
          <circle cx="318" cy="160" r="4.5" fill="#28d8b0" opacity="0.5"/>
          <circle cx="332" cy="158" r="5" fill="#20c8a0" opacity="0.55" filter="url(#spotBlur)"/>
          <circle cx="345" cy="160" r="4" fill="#18b890" opacity="0.5"/>
          <circle cx="358" cy="162" r="4.5" fill="#22c8a0" opacity="0.45" filter="url(#spotBlur)"/>
          <circle cx="325" cy="172" r="4" fill="#25d0a8" opacity="0.45"/>
          <circle cx="340" cy="175" r="5" fill="#15b898" opacity="0.4" filter="url(#spotBlur)"/>
          <circle cx="355" cy="172" r="4" fill="#20c8a0" opacity="0.4"/>
          <circle cx="330" cy="188" r="4.5" fill="#18c898" opacity="0.35" filter="url(#spotBlur)"/>
          <circle cx="345" cy="190" r="4" fill="#22c8a0" opacity="0.3"/>
        </g>

        <!-- White/spotted throat -->
        <g clip-path="url(#throatClip)">
          <path d="M 340,190 C 355,195 372,210 378,228 C 382,242 375,255 362,258 C 348,260 335,252 330,240 C 325,228 328,210 335,198 Z" fill="#d0c8c0"/>
          <!-- Throat spots -->
          <circle cx="350" cy="215" r="3" fill="#a8a098" opacity="0.5"/>
          <circle cx="358" cy="225" r="2.5" fill="#a8a098" opacity="0.45"/>
          <circle cx="345" cy="230" r="3" fill="#a8a098" opacity="0.4"/>
          <circle cx="355" cy="240" r="2.5" fill="#a8a098" opacity="0.4"/>
          <circle cx="340" cy="245" r="2" fill="#a8a098" opacity="0.35"/>
          <circle cx="362" cy="235" r="2" fill="#a8a098" opacity="0.35"/>
        </g>

        <!-- Eye -->
        <circle cx="362" cy="180" r="7.5" fill="#0e0808"/>
        <circle cx="359" cy="177" r="2.8" fill="white" opacity="0.82"/>
        <circle cx="365" cy="183" r="1" fill="white" opacity="0.3"/>

        <!-- Long thin beak — angled upward -->
        <path d="M 390,188 L 462,150 L 390,195 Z" fill="#1a1a18"/>
        <line x1="390" y1="191" x2="460" y2="152" stroke="#0e0e0c" stroke-width="0.6"/>

        <!-- Feet -->
        <g stroke="#3a3830" stroke-width="2" stroke-linecap="round" fill="none">
          <path d="M 290,332 L 288,308"/>
          <path d="M 288,308 L 280,313"/>
          <path d="M 288,308 L 295,313"/>
          <path d="M 320,328 L 322,305"/>
          <path d="M 322,305 L 315,310"/>
          <path d="M 322,305 L 330,310"/>
        </g>

        <!-- Wing feather lines -->
        <g stroke="#1a2820" stroke-width="0.5" opacity="0.25" fill="none">
          <path d="M 242,215 C 255,212 270,218 280,225"/>
          <path d="M 238,245 C 252,242 268,248 278,255"/>
          <path d="M 236,275 C 250,272 265,278 275,285"/>
          <path d="M 242,302 C 253,299 266,305 274,310"/>
        </g>
      </g>

      <!-- Vignette -->
      <rect width="550" height="420" fill="url(#vignette)"/>
    </svg>
  </div>
</body>
</html>
