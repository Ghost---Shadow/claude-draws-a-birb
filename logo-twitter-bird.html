  <h1>Twitter Bird (Larry)</h1>
  <p class="sub">Classic Twitter bird silhouette — visual memory reconstruction, bezier paths only.</p>
  <div class="logo-wrap">
    <!--
      TWITTER BIRD — Clean reconstruction (Iteration 3)

      The classic Twitter bird "Larry" faces RIGHT, head tilted upward.
      Key visual characteristics:
      - Open beak at upper-LEFT, pointing left-ish
      - Rounded head
      - Large body
      - Wing sweeps UP from the body, peak at top-right area
      - Three distinct tail feathers at lower-left, fanning downward-left
      - White dot eye on head

      I'll define the path as a series of clean cubic bezier curves.
      The path goes CLOCKWISE starting from the beak tip.

      Coordinate plan (viewBox 500 x 420, centered around 250,210):

      Beak upper tip:   (80, 170)
      Beak top base:    (115, 135)  ← where upper beak meets head
      Head crown:       (195, 65)
      Nape:             (250, 70)
      Wing shoulder:    (290, 55)
      Wing peak:        (355, 35)   ← highest point of wing
      Wing right:       (430, 110)
      Body upper-right: (440, 200)
      Body lower-right: (400, 285)
      Rump:             (340, 330)
      Tail junction:    (265, 345)
      Tail feather 1 tip: (225, 365) ← long downward feather
      Tail notch 1-2:   (245, 340)
      Tail feather 2 tip: (185, 340)
      Tail notch 2-3:   (210, 315)
      Tail feather 3 tip: (155, 305)
      Belly lower-left: (155, 270)
      Breast:           (95, 220)
      Throat-lower:     (80, 195)
      Lower beak base:  (115, 175)
      Beak lower tip:   (80, 190)   ← lower jaw
      → back to (80, 170) upper beak tip
    -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="500" height="420">

        Each C command: C cp1x,cp1y cp2x,cp2y endx,endy
      -->
