    then scaled ×(500/1920)=0.2604 to fit 500×500 canvas.

    Key scan results (1920px → 500px):
      Back arch:    (180,208)→(195,195)→(211,182)→(227,172)→(242,162)→(258,152)→(273,138)→(286,129)

      Right breast: (382,182)→(379,208)→(376,234)→(366,260)→(349,287)→(316,313)
      Bottom:       (227,323)
      Left side:    (89,313)→(101,287)→(126,260)→(152,234)→(180,208)
      Wing right:   (305,195)→(304,208)→(299,221)→(290,234)→(274,247)→(250,260)→(214,273)→(151,287)
      Blue-gray top: (182,206)→(195,195)→(208,185)→(221,175)→(234,166)→(247,158)→(260,149)→(273,153)→(286,127)
      Blue-gray bot: (182,228)→(195,222)→(208,216)→(221,211)→(234,205)→(247,200)→(260,196)→(273,192)→(286,189)
      Head (radial): (381,132)→(360,118)→(338,113)→(309,117)→(292,146)→(323,163)→(339,173)→(370,191)
      Head centre:  (344,146)
      Beak:         (381,132)→tip(440,156)→(370,191)
      Eye centre:   (355,159)  r≈4
      Tail right:   (163,287)→(143,300)→(124,313)→(106,326)→(88,339)→(57,358)
      Tail left:    (52,358)→(64,339)→(77,326)→(89,313)→(102,300)→(109,293)→(152,287)
      Front leg:    x=227, y=323–380
      Back leg:     x=295, y=323–380
      Front foot:   (213,383)→(227,379)→(281,384)
      Back foot:    (284,383)→(295,379)→(350,384)

    RULE: only <polygon> with exactly 3 points (triangles). No other shapes.

    Z-order (painter model, bottom→top):
      1. Shadow
      2. Orange body (fan from 250,260)
      3. Yellow belly (fan from 268,295)
      4. Orange-red tail (fan from 163,287)
      5. Dark wing (fan from 210,248)
      6. Blue-gray accent (strip tessellation)
      7. Dark head (fan from 344,146)
      8. Beak
      9. Eye
     10. Legs / feet
  -->

    -->

    <!-- ── 6. BLUE-GRAY ACCENT ──
         Pixel-scanned strip along top of wing.
         Each column pair: upper(x,ytop)→upper(x+Δ,ytop) + lower(x,ybot)→lower(x+Δ,ybot)
         Tessellated as pairs of triangles left→right.
    -->
    <!-- col 182→195 -->
    <polygon points="182,206  195,195  195,222" fill="#8fb0be"/>

    -->

    <polygon points="359,159  355,163  351,159" fill="#ffffff"/>
