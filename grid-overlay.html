<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reference Grid Overlay Tool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #1a2a1a;
      font-family: monospace;
      color: #c8d8b0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      gap: 1rem;
    }

    h1 { font-size: 1.1rem; color: #90b870; letter-spacing: 0.05em; }

    /* ── controls ── */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      align-items: center;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      width: 100%;
      max-width: 960px;
    }
    .ctrl { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; }
    .ctrl label { color: #90a870; white-space: nowrap; }

    select, input[type=number] {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
      color: #c8d8b0;
      padding: 0.25rem 0.4rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.8rem;
    }
    select { cursor: pointer; }

    input[type=range] { width: 90px; accent-color: #90b870; }
    input[type=color] { width: 32px; height: 24px; border: none; background: none; cursor: pointer; padding: 0; }

    button {
      background: rgba(144,184,112,0.2);
      border: 1px solid rgba(144,184,112,0.4);
      color: #c8d8b0;
      padding: 0.35rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.8rem;
      transition: background 0.15s;
    }
    button:hover { background: rgba(144,184,112,0.35); }
    button.active { background: rgba(144,184,112,0.45); border-color: #90b870; }

    /* ── drop zone ── */
    #drop-zone {
      width: 100%;
      max-width: 960px;
      min-height: 120px;
      border: 2px dashed rgba(144,184,112,0.4);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      color: #90a870;
      font-size: 0.9rem;
      transition: border-color 0.2s, background 0.2s;
      cursor: pointer;
      position: relative;
    }
    #drop-zone.drag-over {
      border-color: #90b870;
      background: rgba(144,184,112,0.08);
    }
    #drop-zone input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    #drop-btn {
      background: rgba(144,184,112,0.2);
      border: 1px solid rgba(144,184,112,0.4);
      color: #c8d8b0;
      padding: 0.35rem 0.9rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.8rem;
      pointer-events: none;
    }

    /* ── canvas wrapper ── */
    #canvas-wrap {
      position: relative;
      line-height: 0;
      display: none;
    }
    #canvas-wrap canvas {
      display: block;
      cursor: crosshair;
      border-radius: 4px;
    }
    /* tooltip that follows the cursor */
    #tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(0,0,0,0.85);
      border: 1px solid rgba(144,184,112,0.5);
      color: #c8d8b0;
      font-size: 0.72rem;
      padding: 0.3rem 0.55rem;
      border-radius: 5px;
      white-space: pre;
      display: none;
      z-index: 100;
    }

    /* ── info panel ── */
    #info-panel {
      width: 100%;
      max-width: 960px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.8rem;
      display: none;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .info-block {
      flex: 1;
      min-width: 200px;
    }
    .info-block h3 {
      font-size: 0.72rem;
      color: #90a870;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }
    .info-block .val {
      color: #e0f0c8;
      word-break: break-all;
    }
    .color-swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 3px;
      vertical-align: middle;
      border: 1px solid rgba(255,255,255,0.15);
      margin-right: 4px;
    }

    /* ── output box ── */
    #output-wrap {
      width: 100%;
      max-width: 960px;
      display: none;
    }
    #output {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #a0e880;
      font-family: monospace;
      font-size: 0.78rem;
      padding: 0.6rem 0.9rem;
      resize: vertical;
      min-height: 60px;
    }
    .output-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.4rem;
    }
    .output-row span { font-size: 0.75rem; color: #90a870; }

    #copy-btn { white-space: nowrap; }
    #copy-btn.copied { color: #a0e880; border-color: #a0e880; }

    /* ── color sample grid ── */
    #sample-grid-wrap {
      width: 100%;
      max-width: 960px;
      display: none;
    }
    #sample-grid-wrap h3 {
      font-size: 0.72rem;
      color: #90a870;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }
    #sample-grid {
      display: grid;
      gap: 2px;
      width: 100%;
    }
    .sample-cell {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 2px;
      position: relative;
      cursor: pointer;
      transition: outline 0.1s;
    }
    .sample-cell:hover { outline: 2px solid #fff; }
    .sample-cell .cell-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.5rem;
      color: rgba(255,255,255,0.7);
      mix-blend-mode: difference;
      pointer-events: none;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <h1>Reference Grid Overlay Tool</h1>

  <!-- controls row -->
  <div class="controls">
    <div class="ctrl">
      <label>Grid</label>
      <select id="density-select">
        <option value="4">4 × 4</option>
        <option value="8" selected>8 × 8</option>
        <option value="16">16 × 16</option>
        <option value="32">32 × 32</option>
        <option value="custom">Custom…</option>
      </select>
    </div>
    <div class="ctrl" id="custom-ctrl" style="display:none">
      <label>Cols</label>
      <input type="number" id="cols-in" value="12" min="2" max="52" style="width:50px">
      <label>Rows</label>
      <input type="number" id="rows-in" value="12" min="2" max="52" style="width:50px">
    </div>
    <div class="ctrl">
      <label>Line colour</label>
      <input type="color" id="line-color" value="#ffff00">
    </div>
    <div class="ctrl">
      <label>Opacity</label>
      <input type="range" id="line-opacity" min="10" max="100" value="55">
      <span id="opacity-val" style="min-width:2.5em">55%</span>
    </div>
    <div class="ctrl">
      <label>Label size</label>
      <input type="range" id="label-size" min="8" max="24" value="12">
    </div>
    <div class="ctrl">
      <label>Max display px</label>
      <input type="number" id="max-px" value="800" min="200" max="2000" style="width:70px">
    </div>
    <div class="ctrl">
      <button id="sample-toggle">Show Color Samples</button>
    </div>
    <div class="ctrl">
      <button id="redraw-btn">Redraw Grid</button>
    </div>
  </div>

  <!-- drop zone (hidden once image loads) -->
  <div id="drop-zone">
    <input type="file" id="file-input" accept="image/*">
    <span>Drag &amp; drop image here</span>
    <button id="drop-btn">Browse file</button>
  </div>

  <!-- canvas -->
  <div id="canvas-wrap">
    <canvas id="overlay-canvas"></canvas>
  </div>
  <div id="tooltip"></div>

  <!-- click info panel -->
  <div id="info-panel">
    <div class="info-block">
      <h3>Clicked Cell</h3>
      <div class="val" id="info-cell">—</div>
    </div>
    <div class="info-block">
      <h3>Cell Center (img px)</h3>
      <div class="val" id="info-center">—</div>
    </div>
    <div class="info-block">
      <h3>Top-Left → Bottom-Right (img px)</h3>
      <div class="val" id="info-corners">—</div>
    </div>
    <div class="info-block">
      <h3>Click Point (img px)</h3>
      <div class="val" id="info-click">—</div>
    </div>
    <div class="info-block">
      <h3>Pixel Color</h3>
      <div class="val" id="info-color">—</div>
    </div>
  </div>

  <!-- JSON output -->
  <div id="output-wrap">
    <div class="output-row">
      <span>Last click JSON (paste into SVG notes):</span>
      <button id="copy-btn">Copy JSON</button>
    </div>
    <textarea id="output" readonly rows="3"></textarea>
  </div>

  <!-- color sample grid -->
  <div id="sample-grid-wrap">
    <h3>Cell Color Samples — click any to select</h3>
    <div id="sample-grid"></div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────────
    let img = null;               // HTMLImageElement
    let imgNatW = 0, imgNatH = 0; // natural (original) pixel dimensions
    let displayW = 0, displayH = 0; // canvas display dimensions
    let gridCols = 8, gridRows = 8;
    let showSamples = false;
    let lastClickData = null;
    let offscreenCtx = null;      // for color sampling at full native resolution

    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');
    const infoPanel = document.getElementById('info-panel');
    const outputWrap = document.getElementById('output-wrap');
    const sampleGridWrap = document.getElementById('sample-grid-wrap');

    // ── Helpers ────────────────────────────────────────────────────────────────

    // Convert a 0-based column index to letter(s): 0→A, 25→Z, 26→AA, etc.
    function colLabel(i) {
      let s = '';
      i += 1; // 1-based
      while (i > 0) {
        const rem = (i - 1) % 26;
        s = String.fromCharCode(65 + rem) + s;
        i = Math.floor((i - 1) / 26);
      }
      return s;
    }

    function parseGridSettings() {
      const sel = document.getElementById('density-select').value;
      if (sel === 'custom') {
        gridCols = Math.max(2, Math.min(52, parseInt(document.getElementById('cols-in').value) || 12));
        gridRows = Math.max(2, Math.min(52, parseInt(document.getElementById('rows-in').value) || 12));
      } else {
        const n = parseInt(sel);
        gridCols = n;
        gridRows = n;
      }
    }

    function getLineColor() {
      const hex = document.getElementById('line-color').value;
      const opacity = parseInt(document.getElementById('line-opacity').value) / 100;
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return { r, g, b, opacity };
    }

    function getLabelSize() {
      return parseInt(document.getElementById('label-size').value);
    }

    // Sample the pixel colour from the offscreen (native-res) canvas at native coords (nx, ny)
    function samplePixel(nx, ny) {
      if (!offscreenCtx) return null;
      const d = offscreenCtx.getImageData(Math.round(nx), Math.round(ny), 1, 1).data;
      return { r: d[0], g: d[1], b: d[2], a: d[3] };
    }

    function rgbToHex(r, g, b) {
      return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
    }

    // Map display coords to native image coords
    function displayToNative(dx, dy) {
      return {
        nx: (dx / displayW) * imgNatW,
        ny: (dy / displayH) * imgNatH
      };
    }

    // ── Drawing ────────────────────────────────────────────────────────────────
    function drawGrid() {
      if (!img) return;
      parseGridSettings();

      const lc = getLineColor();
      const labelSize = getLabelSize();

      // clear
      ctx.clearRect(0, 0, displayW, displayH);

      // draw image
      ctx.drawImage(img, 0, 0, displayW, displayH);

      const cellW = displayW / gridCols;
      const cellH = displayH / gridRows;

      ctx.strokeStyle = `rgba(${lc.r},${lc.g},${lc.b},${lc.opacity})`;
      ctx.lineWidth = 1;

      // vertical lines
      for (let c = 0; c <= gridCols; c++) {
        const x = Math.round(c * cellW) + 0.5;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, displayH);
        ctx.stroke();
      }
      // horizontal lines
      for (let r = 0; r <= gridRows; r++) {
        const y = Math.round(r * cellH) + 0.5;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(displayW, y);
        ctx.stroke();
      }

      // labels
      ctx.font = `bold ${labelSize}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';

      const shadowColor = `rgba(0,0,0,0.7)`;
      const textColor = `rgba(${lc.r},${lc.g},${lc.b},${Math.min(1, lc.opacity + 0.25)})`;

      for (let c = 0; c < gridCols; c++) {
        for (let r = 0; r < gridRows; r++) {
          const label = colLabel(c) + (r + 1);
          const x = c * cellW + cellW / 2;
          const y = r * cellH + 3;
          // shadow
          ctx.fillStyle = shadowColor;
          ctx.fillText(label, x + 1, y + 1);
          // main text
          ctx.fillStyle = textColor;
          ctx.fillText(label, x, y);
        }
      }
    }

    // ── Color sample grid ──────────────────────────────────────────────────────
    function buildSampleGrid() {
      const container = document.getElementById('sample-grid');
      container.innerHTML = '';
      container.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;

      for (let r = 0; r < gridRows; r++) {
        for (let c = 0; c < gridCols; c++) {
          const label = colLabel(c) + (r + 1);
          // center of cell in native coords
          const nxCenter = ((c + 0.5) / gridCols) * imgNatW;
          const nyCenter = ((r + 0.5) / gridRows) * imgNatH;
          const px = samplePixel(nxCenter, nyCenter);
          const hex = px ? rgbToHex(px.r, px.g, px.b) : '#888';

          const div = document.createElement('div');
          div.className = 'sample-cell';
          div.style.background = hex;
          div.title = `${label}: ${hex}`;
          const lbl = document.createElement('div');
          lbl.className = 'cell-label';
          lbl.textContent = label;
          div.appendChild(lbl);

          div.addEventListener('click', () => {
            selectCell(c, r, null, null);
          });
          container.appendChild(div);
        }
      }
      sampleGridWrap.style.display = 'block';
    }

    // ── Cell selection / click handling ───────────────────────────────────────
    function selectCell(col, row, clickDx, clickDy) {
      const cellW = displayW / gridCols;
      const cellH = displayH / gridRows;

      // Cell bounds in display coords
      const dLeft   = col * cellW;
      const dTop    = row * cellH;
      const dRight  = (col + 1) * cellW;
      const dBottom = (row + 1) * cellH;
      const dCenterX = dLeft + cellW / 2;
      const dCenterY = dTop  + cellH / 2;

      // Map to native image coords
      const { nx: nLeft,   ny: nTop    } = displayToNative(dLeft,    dTop);
      const { nx: nRight,  ny: nBottom } = displayToNative(dRight,   dBottom);
      const { nx: nCX,     ny: nCY     } = displayToNative(dCenterX, dCenterY);

      let nClickX = null, nClickY = null;
      if (clickDx != null) {
        const n = displayToNative(clickDx, clickDy);
        nClickX = Math.round(n.nx);
        nClickY = Math.round(n.ny);
      }

      const cellLabel = colLabel(col) + (row + 1);
      const px = samplePixel(nCX, nCY);
      const hexColor = px ? rgbToHex(px.r, px.g, px.b) : null;

      const data = {
        cell: cellLabel,
        center: [Math.round(nCX), Math.round(nCY)],
        topLeft: [Math.round(nLeft), Math.round(nTop)],
        bottomRight: [Math.round(nRight), Math.round(nBottom)],
        ...(nClickX != null && { clickPoint: [nClickX, nClickY] }),
        ...(hexColor && { centerColor: hexColor })
      };
      lastClickData = data;

      // Update info panel
      infoPanel.style.display = 'flex';
      document.getElementById('info-cell').textContent = cellLabel;
      document.getElementById('info-center').textContent = `[${data.center}]`;
      document.getElementById('info-corners').textContent =
        `[${data.topLeft}] → [${data.bottomRight}]`;
      document.getElementById('info-click').textContent =
        nClickX != null ? `[${nClickX}, ${nClickY}]` : '—';

      const colorEl = document.getElementById('info-color');
      if (hexColor) {
        colorEl.innerHTML =
          `<span class="color-swatch" style="background:${hexColor}"></span>${hexColor}`;
      } else {
        colorEl.textContent = '—';
      }

      // JSON output
      outputWrap.style.display = 'block';
      document.getElementById('output').value = JSON.stringify(data, null, 2);

      // Highlight the cell on the canvas
      drawGrid();
      const lc = getLineColor();
      ctx.fillStyle = `rgba(${lc.r},${lc.g},${lc.b},0.2)`;
      ctx.fillRect(
        Math.round(col * (displayW / gridCols)),
        Math.round(row * (displayH / gridRows)),
        Math.round(displayW / gridCols),
        Math.round(displayH / gridRows)
      );
    }

    // ── Canvas mouse events ────────────────────────────────────────────────────
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const dx = e.clientX - rect.left;
      const dy = e.clientY - rect.top;

      const col = Math.floor((dx / displayW) * gridCols);
      const row = Math.floor((dy / displayH) * gridRows);
      if (col < 0 || col >= gridCols || row < 0 || row >= gridRows) return;

      const { nx, ny } = displayToNative(dx, dy);
      const px = samplePixel(nx, ny);
      const hex = px ? rgbToHex(px.r, px.g, px.b) : '';
      const cellLbl = colLabel(col) + (row + 1);

      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top  = (e.clientY + 14) + 'px';
      tooltip.textContent =
        `Cell ${cellLbl}  img(${Math.round(nx)}, ${Math.round(ny)})${hex ? '  ' + hex : ''}`;
    });

    canvas.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
    });

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const dx = e.clientX - rect.left;
      const dy = e.clientY - rect.top;
      const col = Math.floor((dx / displayW) * gridCols);
      const row = Math.floor((dy / displayH) * gridRows);
      if (col < 0 || col >= gridCols || row < 0 || row >= gridRows) return;
      selectCell(col, row, dx, dy);
    });

    // ── Copy button ────────────────────────────────────────────────────────────
    document.getElementById('copy-btn').addEventListener('click', () => {
      const txt = document.getElementById('output').value;
      navigator.clipboard.writeText(txt).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy JSON';
          btn.classList.remove('copied');
        }, 1500);
      });
    });

    // ── Image loading ──────────────────────────────────────────────────────────
    function loadImage(file) {
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        img = image;
        imgNatW = image.naturalWidth;
        imgNatH = image.naturalHeight;

        // Build offscreen canvas for pixel sampling at native resolution
        const offscreen = document.createElement('canvas');
        offscreen.width  = imgNatW;
        offscreen.height = imgNatH;
        offscreenCtx = offscreen.getContext('2d');
        offscreenCtx.drawImage(image, 0, 0);

        // Compute display size
        const maxPx = parseInt(document.getElementById('max-px').value) || 800;
        const scale = Math.min(1, maxPx / Math.max(imgNatW, imgNatH));
        displayW = Math.round(imgNatW * scale);
        displayH = Math.round(imgNatH * scale);

        canvas.width  = displayW;
        canvas.height = displayH;

        document.getElementById('canvas-wrap').style.display = 'block';
        document.getElementById('drop-zone').style.display   = 'none';

        parseGridSettings();
        drawGrid();
        if (showSamples) buildSampleGrid();
        URL.revokeObjectURL(url);
      };
      image.src = url;
    }

    // File input
    document.getElementById('file-input').addEventListener('change', (e) => {
      if (e.target.files[0]) loadImage(e.target.files[0]);
    });

    // Drag-and-drop
    const dropZone = document.getElementById('drop-zone');
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) loadImage(file);
    });

    // Also allow drag-drop onto canvas when image already loaded
    canvas.addEventListener('dragover', (e) => e.preventDefault());
    canvas.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) loadImage(file);
    });

    // ── Control event listeners ────────────────────────────────────────────────
    document.getElementById('density-select').addEventListener('change', (e) => {
      const custom = e.target.value === 'custom';
      document.getElementById('custom-ctrl').style.display = custom ? 'flex' : 'none';
      if (img) { parseGridSettings(); drawGrid(); if (showSamples) buildSampleGrid(); }
    });

    document.getElementById('cols-in').addEventListener('input', () => {
      if (img) { parseGridSettings(); drawGrid(); if (showSamples) buildSampleGrid(); }
    });
    document.getElementById('rows-in').addEventListener('input', () => {
      if (img) { parseGridSettings(); drawGrid(); if (showSamples) buildSampleGrid(); }
    });

    document.getElementById('line-color').addEventListener('input', () => {
      if (img) drawGrid();
    });

    document.getElementById('line-opacity').addEventListener('input', (e) => {
      document.getElementById('opacity-val').textContent = e.target.value + '%';
      if (img) drawGrid();
    });

    document.getElementById('label-size').addEventListener('input', () => {
      if (img) drawGrid();
    });

    document.getElementById('redraw-btn').addEventListener('click', () => {
      if (!img) return;
      const maxPx = parseInt(document.getElementById('max-px').value) || 800;
      const scale = Math.min(1, maxPx / Math.max(imgNatW, imgNatH));
      displayW = Math.round(imgNatW * scale);
      displayH = Math.round(imgNatH * scale);
      canvas.width  = displayW;
      canvas.height = displayH;
      parseGridSettings();
      drawGrid();
      if (showSamples) buildSampleGrid();
    });

    document.getElementById('sample-toggle').addEventListener('click', (e) => {
      showSamples = !showSamples;
      e.target.textContent = showSamples ? 'Hide Color Samples' : 'Show Color Samples';
      e.target.classList.toggle('active', showSamples);
      if (showSamples && img) {
        buildSampleGrid();
      } else {
        sampleGridWrap.style.display = 'none';
      }
    });
  </script>
</body>
</html>
